name: MA-CLI Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build MA-CLI executable
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --name ma-cli --clean --console --paths . installer\ma_cli_launcher.py
          if (-not (Test-Path "dist\ma-cli.exe")) { throw "ma-cli.exe was not created" }
          .\dist\ma-cli.exe --version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MA-CLI-Setup.iss"
          if (-not (Test-Path "dist\windows\MA-CLI-Setup-v1.0.0.exe")) { throw "Installer was not created" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MA-CLI-Windows-v1.0.0
          path: |
            dist/ma-cli.exe
            dist/windows/MA-CLI-Setup-v1.0.0.exe
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ma-cli.exe
            dist/windows/MA-CLI-Setup-v1.0.0.exe
          generate_release_notes: true
